name: Verify and prepare deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Aplicar migrations no banco de produção após as verificações
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run assets:setup
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
  migrate-supabase:
    needs: verify
    # Publicação da interface não autoriza alterações no banco.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.run_migrations == true
    runs-on: ubuntu-latest
    environment: supabase-production
    concurrency:
      group: supabase-production-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_PUBLIC_URL: ${{ vars.VITE_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Supabase deployment configuration
        shell: bash
        run: |
          missing=0
          for key in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Configure o secret $key no ambiente supabase-production."
              missing=1
            fi
          done
          if [ -z "$SUPABASE_PROJECT_REF" ] && [[ "$SUPABASE_PUBLIC_URL" =~ ^https://([a-z0-9]+)\.supabase\.co/?$ ]]; then
            SUPABASE_PROJECT_REF="${BASH_REMATCH[1]}"
          fi
          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]+$ ]]; then
            echo "::error::Configure a variable SUPABASE_PROJECT_REF no ambiente supabase-production."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "SUPABASE_PROJECT_REF=$SUPABASE_PROJECT_REF" >> "$GITHUB_ENV"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push
